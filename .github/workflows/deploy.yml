name: Deploy

# Phase 7 (deploy.md 5). NOTHING DEPLOYS until the owner approves GATE 3 and sets the repository
# variable DEPLOY_ENABLED to 'true'. Even then the job waits for the owner's approval on the
# `production` environment.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      only:
        description: 'What to deploy (rollback: run on an older commit with only=function)'
        type: choice
        options: [all, function]
        default: all

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ONLY: ${{ inputs.only || 'all' }}
      # No custom domain (ADR 0040): the app lives on Cloudflare Pages. If `haide` is taken on
      # pages.dev, set the repo variable PAGES_PROJECT to the project name you got.
      PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'haide' }}
      PAGES_URL: https://${{ vars.PAGES_PROJECT || 'haide' }}.pages.dev
      SUPPORT_EMAIL: dragosbraicu9@gmail.com
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: pnpm install --frozen-lockfile

      - name: Build web (public values only)
        if: ${{ env.ONLY == 'all' }}
        env:
          VITE_API_BASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/api/v1
          VITE_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_APP_VERSION: ${{ github.sha }}
        run: pnpm build

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Push migrations
        if: ${{ env.ONLY == 'all' }}
        # CLI >= 2.x defaults to the local stack (--remote) and asks for confirmation (--yes).
        run: supabase db push --remote --yes

      - name: Roles and Vault (idempotent)
        if: ${{ env.ONLY == 'all' }}
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          API_DB_PASSWORD: ${{ secrets.API_DB_PASSWORD }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "$(cat supabase/.temp/pooler-url)" -v ON_ERROR_STOP=1 \
            -v api_pw="$API_DB_PASSWORD" -v cron="$CRON_SECRET" \
            -v tick_url="https://${PROJECT_REF}.supabase.co/functions/v1/api/v1/internal/tick" \
            -f scripts/deploy/setup-roles.sql

      - name: Push auth config (Google enabled, Brevo SMTP)
        if: ${{ env.ONLY == 'all' }}
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
        run: |
          set -euo pipefail
          # Production-only overrides of the local config (deploy.md 4.4), applied on the runner copy.
          sed -i "s#^site_url = .*#site_url = \"${PAGES_URL}\"#" supabase/config.toml
          sed -i "s#\"http://localhost:5173/auth/callback\",#\"${PAGES_URL}/auth/callback\",#" supabase/config.toml
          sed -i '/^\[auth.external.google\]/,/^$/ s/enabled = false/enabled = true/' supabase/config.toml
          sed -i 's/^# \[auth.email.smtp\]/[auth.email.smtp]/; s/^# \(host\|port\|user\|pass\|admin_email\|sender_name\) =/\1 =/' supabase/config.toml
          # The Brevo single sender is the owner's verified address (no domain, ADR 0040).
          # Must run after the uncomment above: the line is commented in config.toml until then.
          sed -i "s#^admin_email = .*#admin_email = \"${SUPPORT_EMAIL}\"#" supabase/config.toml
          supabase config push --project-ref "$PROJECT_REF" --yes

      - name: Function secrets
        env:
          API_DB_PASSWORD: ${{ secrets.API_DB_PASSWORD }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          IP_HASH_SALT_SEED: ${{ secrets.IP_HASH_SALT_SEED }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          pooler_host="$(sed -E 's#.*@([^:/]+).*#\1#' supabase/.temp/pooler-url)"
          {
            echo "APP_ENV=production"
            echo "APP_VERSION=${GITHUB_SHA}"
            echo "API_DB_URL=postgresql://haide_api.${PROJECT_REF}:${API_DB_PASSWORD}@${pooler_host}:6543/postgres"
            echo "CRON_SECRET=${CRON_SECRET}"
            echo "ROUTING_PROVIDER=ors"
            echo "ORS_API_KEY=${ORS_API_KEY}"
            echo "EMAIL_PROVIDER=brevo"
            echo "BREVO_API_KEY=${BREVO_API_KEY}"
            echo "EMAIL_FROM=Haide <${SUPPORT_EMAIL}>"
            echo "EMAIL_SUPPORT_TO=${SUPPORT_EMAIL}"
            echo "EMAIL_DAILY_CAP=280"
            echo "APP_BASE_URL=${PAGES_URL}"
            echo "CORS_ORIGINS=${PAGES_URL}"
            echo "VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}"
            echo "VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}"
            echo "VAPID_SUBJECT=mailto:${SUPPORT_EMAIL}"
            echo "IP_HASH_SALT_SEED=${IP_HASH_SALT_SEED}"
          } > "$RUNNER_TEMP/function.env"
          supabase secrets set --env-file "$RUNNER_TEMP/function.env" --project-ref "$PROJECT_REF"
          rm -f "$RUNNER_TEMP/function.env"

      - name: Deploy API function
        run: supabase functions deploy api --no-verify-jwt --project-ref "$PROJECT_REF"

      - name: Deploy web to Cloudflare Pages
        if: ${{ env.ONLY == 'all' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch main || echo "project already exists"
          npx --yes wrangler@4 pages deploy apps/web/dist --project-name "$PAGES_PROJECT" --branch main

      - name: Smoke test
        run: |
          curl -fsS --retry 5 --retry-delay 5 "https://${PROJECT_REF}.supabase.co/functions/v1/api/v1/health"
          if [ "$ONLY" = "all" ]; then
            curl -fsS --retry 5 --retry-delay 10 "${PAGES_URL}/find" > /dev/null
          fi
