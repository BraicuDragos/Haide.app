name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Deno 2 matches the Supabase Edge Runtime (conventions 2).
  DENO_VERSION: 2.x

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests with coverage (domain >= 90 % lines)
        run: pnpm test
      - name: Web build
        run: pnpm build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Deno check and lint (Edge Function, as it runs in production)
        run: |
          deno check --config supabase/functions/deno.json supabase/functions/api/index.ts
          deno lint --config supabase/functions/deno.json --ignore='**/*.test.ts,**/testing.ts' supabase/functions
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    env:
      API_BASE_URL: http://127.0.0.1:54321/functions/v1/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start the local Supabase stack
        run: supabase start -x studio,imgproxy,logflare,vector,realtime,postgres-meta
      - name: Reset database (migrations + seed)
        run: supabase db reset
      - name: pgTAP (grants, RLS, functions, gazetteer search)
        run: supabase test db
      - name: Serve the API function
        run: |
          # Throwaway values for this job only: nothing here is a real secret.
          cat > "$RUNNER_TEMP/api.env" <<EOF
          APP_ENV=test
          APP_VERSION=${GITHUB_SHA}
          API_DB_URL=postgresql://haide_api:haide_api_local@supabase_db_haide:5432/postgres
          CRON_SECRET=$(openssl rand -hex 16)
          IP_HASH_SALT_SEED=$(openssl rand -hex 16)
          ROUTING_PROVIDER=fixture
          EMAIL_PROVIDER=console
          CORS_ORIGINS=http://localhost:5173
          EOF
          echo "CRON_SECRET=$(grep ^CRON_SECRET "$RUNNER_TEMP/api.env" | cut -d= -f2)" >> "$GITHUB_ENV"
          nohup supabase functions serve api --no-verify-jwt --env-file "$RUNNER_TEMP/api.env" > "$RUNNER_TEMP/functions.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS "$API_BASE_URL/health" > /dev/null 2>&1; then echo "API is up"; exit 0; fi
            sleep 2
          done
          echo "API did not start"; cat "$RUNNER_TEMP/functions.log"; exit 1
      - name: API integration tests
        run: pnpm test:int
      - name: Playwright smoke (360x800, axe), once the QA epic adds the config
        run: |
          if [ -f playwright.config.ts ]; then
            pnpm exec playwright install --with-deps chromium
            pnpm test:e2e
          else
            echo "No playwright.config.ts yet, skipping"
          fi
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: |
            ${{ runner.temp }}/functions.log
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
